name: Release From CI Artifacts

on:
  workflow_run:
    workflows:
      - CI Build (Linux/macOS/Windows)
    types:
      - completed

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Resolve Version Tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          TAG=$(git tag --points-at "${{ github.event.workflow_run.head_sha }}" | grep -E '^v' | head -n1 || true)
          if [[ -z "$TAG" ]]; then
            echo "No v* tag on this commit; skip release."
            exit 0
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download Artifact (Linux)
        if: steps.tag.outputs.tag != ''
        uses: dawidd6/action-download-artifact@v6
        with:
          run_id: ${{ github.event.workflow_run.id }}
          name: asr-tool-linux-x86_64
          path: dist/linux

      - name: Download Artifact (macOS)
        if: steps.tag.outputs.tag != ''
        uses: dawidd6/action-download-artifact@v6
        with:
          run_id: ${{ github.event.workflow_run.id }}
          name: asr-tool-macos-arm64
          path: dist/macos

      - name: Download Artifact (Windows)
        if: steps.tag.outputs.tag != ''
        uses: dawidd6/action-download-artifact@v6
        with:
          run_id: ${{ github.event.workflow_run.id }}
          name: asr-tool-windows-x86_64
          path: dist/windows

      - name: Create or Update Release
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist/release
          cp dist/linux/asr-tool-linux-x86_64.zip dist/release/asr-tool-linux-x86_64.zip
          cp dist/macos/asr-tool dist/release/asr-tool-macos-arm64
          cp dist/macos/THIRD_PARTY_NOTICES.txt dist/release/THIRD_PARTY_NOTICES.txt
          cp dist/windows/asr-tool-windows-x86_64.zip dist/release/asr-tool-windows-x86_64.zip
          cp install.sh dist/release/install.sh

          release_flags=()
          if [[ "$TAG" == *-* ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          notes_file="docs/releases/${TAG}.md"
          test -s "$notes_file"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --target "$SHA" --title "$TAG" \
              --draft --notes-file "$notes_file" "${release_flags[@]}"

          gh release upload "$TAG" dist/release/asr-tool-linux-x86_64.zip --clobber
          gh release upload "$TAG" dist/release/asr-tool-macos-arm64 --clobber
          gh release upload "$TAG" dist/release/THIRD_PARTY_NOTICES.txt --clobber
          gh release upload "$TAG" dist/release/asr-tool-windows-x86_64.zip --clobber
          gh release upload "$TAG" dist/release/install.sh --clobber
          gh release edit "$TAG" --draft=false --notes-file "$notes_file" "${release_flags[@]}"
