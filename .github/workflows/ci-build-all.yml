name: CI Build (Linux/macOS/Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - CMakeLists.txt
      - cmake/**
      - tests/**
      - include/**
      - src/**
      - scripts/**
      - install.sh
      - README.md
      - docs/**
      - SKILL.md
      - .github/workflows/ci-build-all.yml
      - .github/workflows/release-from-artifacts.yml
  pull_request:
    paths:
      - CMakeLists.txt
      - cmake/**
      - tests/**
      - include/**
      - src/**
      - scripts/**
      - install.sh
      - README.md
      - docs/**
      - SKILL.md
      - .github/workflows/ci-build-all.yml
      - .github/workflows/release-from-artifacts.yml

permissions:
  contents: read

jobs:
  evaluation-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tests/evaluation/requirements.txt
      - name: Install evaluation dependencies
        run: python -m pip install -r tests/evaluation/requirements.txt
      - name: Test scoring
        id: scoring
        shell: bash
        run: |
          python -m unittest discover -s tests/evaluation -p 'test_*.py' 2>&1 | tee "$RUNNER_TEMP/scoring-tests.log"
      - name: Test installation logic
        id: installer
        shell: bash
        run: bash tests/check_install_script_content.sh 2>&1 | tee "$RUNNER_TEMP/installer-tests.log"
      - name: Summarize test failure
        if: failure()
        run: |
          for log in "$RUNNER_TEMP/scoring-tests.log" "$RUNNER_TEMP/installer-tests.log"; do
            if [[ "$log" == */scoring-tests.log && '${{ steps.scoring.outcome }}' != failure ]]; then continue; fi
            if [[ "$log" == */installer-tests.log && '${{ steps.installer.outcome }}' != failure ]]; then continue; fi
            if [[ -f "$log" ]]; then
              printf '\n### %s\n\n```text\n' "$(basename "$log")" >> "$GITHUB_STEP_SUMMARY"
              tail -n 160 "$log" >> "$GITHUB_STEP_SUMMARY"
              printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
              message="$(tail -n 80 "$log")"
              message="${message//'%'/'%25'}"
              message="${message//$'\r'/'%0D'}"
              message="${message//$'\n'/'%0A'}"
              printf '::error title=%s::%s\n' "$(basename "$log")" "$message"
            fi
          done

  build:
    if: github.actor != 'github-actions[bot]'
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install CUDA Toolkit (Linux)
        if: runner.os == 'Linux'
        uses: Jimver/cuda-toolkit@v0.2.24
        with:
          cuda: '12.4.1'

      - name: Install CUDA Toolkit (Windows)
        if: runner.os == 'Windows'
        uses: Jimver/cuda-toolkit@v0.2.24
        with:
          cuda: '12.8.1'

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DASR_ENABLE_CUDA=ON -DGGML_CUDA_FA=OFF -DCMAKE_CUDA_ARCHITECTURES='75-real;75-virtual' -DBUILD_SHARED_LIBS=ON -DGGML_BACKEND_DL=ON

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DASR_ENABLE_CUDA=OFF

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DASR_ENABLE_CUDA=ON -DGGML_CUDA_FA=OFF -DCMAKE_CUDA_ARCHITECTURES="75-real;75-virtual" -DBUILD_SHARED_LIBS=ON -DGGML_BACKEND_DL=ON 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/configure-windows.log"

      - name: Summarize Windows configuration failure
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP/configure-windows.log"
          if (Test-Path $log) {
            Add-Content $env:GITHUB_STEP_SUMMARY "### Windows configuration"
            Add-Content $env:GITHUB_STEP_SUMMARY '```text'
            Get-Content $log -Tail 160 | Add-Content $env:GITHUB_STEP_SUMMARY
            Add-Content $env:GITHUB_STEP_SUMMARY '```'
            $message = (Get-Content $log -Tail 80) -join "`n"
            $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows CMake configuration::$message"
          }

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: cmake --build build --parallel 4

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: cmake --build build --parallel

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake --build build --config Release --parallel 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Prepare Output (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p out/linux-x86_64
          cp build/asr-tool out/linux-x86_64/asr-tool
          chmod +x out/linux-x86_64/asr-tool
          find build \( -type f -o -type l \) \( -name 'libwhisper*.so*' -o -name 'libggml*.so*' -o -name 'libsherpa-onnx*.so*' -o -name 'libonnxruntime*.so*' \) -exec cp -fL {} out/linux-x86_64/ \;
          cp docs/THIRD_PARTY_NOTICES.txt out/linux-x86_64/
          out/linux-x86_64/asr-tool --version
          (cd out/linux-x86_64 && zip -r ../asr-tool-linux-x86_64.zip .)

      - name: Prepare Output (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out/macos-arm64
          cp build/asr-tool out/macos-arm64/asr-tool
          cp docs/THIRD_PARTY_NOTICES.txt out/macos-arm64/
          chmod +x out/macos-arm64/asr-tool
          out/macos-arm64/asr-tool --version

      - name: Prepare Output (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out/windows-x86_64 | Out-Null
          Copy-Item build/Release/asr-tool.exe out/windows-x86_64/asr-tool.exe -Force
          Get-ChildItem -Path build -Recurse -File -Include whisper*.dll,ggml*.dll,sherpa-onnx*.dll,onnxruntime*.dll | ForEach-Object {
            Copy-Item $_.FullName out/windows-x86_64 -Force
          }
          Copy-Item docs/THIRD_PARTY_NOTICES.txt out/windows-x86_64 -Force
          & out/windows-x86_64/asr-tool.exe --version
          Compress-Archive -Path out/windows-x86_64/* -DestinationPath out/asr-tool-windows-x86_64.zip -Force

      - name: Upload Artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: asr-tool-linux-x86_64
          path: out/asr-tool-linux-x86_64.zip
          if-no-files-found: error

      - name: Upload Artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: asr-tool-macos-arm64
          path: out/macos-arm64/
          if-no-files-found: error

      - name: Upload Artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: asr-tool-windows-x86_64
          path: out/asr-tool-windows-x86_64.zip
          if-no-files-found: error
